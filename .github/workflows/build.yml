name: Build Windows exe
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pyinstaller
      - run: pyinstaller --windowed --onefile --name Kalorije --add-data "foods.json;." --add-data "images;images" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kalorije-Windows
          path: dist/Kalorije.exe
